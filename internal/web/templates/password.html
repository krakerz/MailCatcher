{{define "content"}}
<form method="post" action="/account/password" class="card narrow">
  <h1>Change password</h1>
  {{if .Data.Forced}}<p class="notice">{{icon "key-round"}}Please choose a new password before continuing.</p>{{end}}
  {{with .Data.Error}}<p class="error">{{icon "circle-alert"}}<span>{{.}}</span></p>{{end}}
  {{with .Data.Saved}}<p class="notice">{{icon "circle-check"}}<span>{{.}}</span></p>{{end}}
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Repeat new password <input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button>Save</button>
</form>
{{end}}
