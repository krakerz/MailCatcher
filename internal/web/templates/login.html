{{define "content"}}
<form method="post" action="/login" class="card narrow">
  <div class="login-brand">
    <img src="{{asset "logo.svg"}}" alt="">
    <h1>MailCatcher</h1>
    <span class="muted">Sign in to read caught mail</span>
  </div>
  {{with .Data.Error}}<p class="error">{{icon "circle-alert"}}<span>{{.}}</span></p>{{end}}
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Username <input name="username" value="{{.Data.Username}}" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button>{{icon "log-out"}} Log in</button>
</form>
{{end}}
