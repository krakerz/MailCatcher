{{define "content"}}
{{$d := .Data}}
<h1>Compose</h1>
{{with $d.Err}}<p class="error">{{icon "circle-alert"}}<span>{{.}}</span></p>{{end}}
{{template "unverified" $d.Unverified}}
<form method="post" action="/compose" enctype="multipart/form-data" class="card" data-compose>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="row">
    <label>Inbox
      <select name="inbox" data-compose-inbox>
        {{range $d.Inboxes}}<option value="{{.ID}}"{{if eq .ID $d.InboxID}} selected{{end}}>{{.Name}}</option>{{end}}
      </select>
    </label>
    <label class="grow">Send as <span class="muted">(real address, e.g. any@example.com)</span>
      <input name="identity" value="{{$d.Identity}}" required data-compose-identity>
    </label>
  </div>
  <p class="mono muted" data-compose-from></p>
  <label>To <span class="muted">(verified destination address)</span> {{template "dest_field" (dict "Name" "to" "Value" $d.To "List" $d.Verified)}}</label>
  <label>Subject <input name="subject" value="{{$d.Subject}}"></label>
  <div class="field"><span class="field-label">Message</span><textarea name="text" rows="10" data-rich data-html="{{$d.HTML}}" aria-label="Message">{{$d.Text}}</textarea></div>
  <label>Attachments <input type="file" name="files" multiple></label>
  <button>Send</button>
</form>
{{end}}
