{{define "content"}}
{{$d := .Data}}{{$m := $d.M}}
<p class="crumbs"><a href="/m/{{$m.ID}}">← {{orNone $m.Subject}}</a></p>
<h1>Reply</h1>
{{with $d.Error}}<p class="error">{{.}}</p>{{end}}
{{template "unverified" $d.Unverified}}
<form method="post" action="/m/{{$m.ID}}/reply" enctype="multipart/form-data" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <table class="meta">
    <tr><th>From</th><td class="mono">{{$m.EnvelopeTo}}{{with $m.DecodedTo}} <span class="muted">(as {{.}})</span>{{end}}</td></tr>
    <tr><th>To</th><td class="mono">{{$d.To}}</td></tr>
    <tr><th>Subject</th><td>{{$d.Subject}}</td></tr>
  </table>
  <label>Message <textarea name="text" rows="10" autofocus>{{$d.Text}}</textarea></label>
  <label class="check"><input type="checkbox" name="quote" value="1"{{if $d.Quote}} checked{{end}}> Quote the original message</label>
  <label>Attachments <input type="file" name="files" multiple></label>
  <button>Send reply</button>
</form>
{{template "original" $m}}
{{end}}
