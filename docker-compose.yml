services:
  mailcatcher:
    # Prebuilt image; set MC_IMAGE to your own, or add --build to build this checkout.
    image: ${MC_IMAGE:-ghcr.io/krakerz/mailcatcher:latest}
    build: .
    restart: unless-stopped
    # Must own ./data on the host: create it first (mkdir data) as this user.
    user: "${MC_UID:-1000}:${MC_GID:-1000}"
    environment:
      MC_DOMAIN: ${MC_DOMAIN}
      MC_HMAC_SECRET: ${MC_HMAC_SECRET}
      MC_WORKER_URL: ${MC_WORKER_URL}
      MC_PUBLIC_URL: ${MC_PUBLIC_URL:-}
      MC_CF_API_TOKEN: ${MC_CF_API_TOKEN:-}
      MC_CF_ACCOUNT_ID: ${MC_CF_ACCOUNT_ID:-}
      MC_ADMIN_PASSWORD: ${MC_ADMIN_PASSWORD:-}
      MC_RETENTION_DAYS: ${MC_RETENTION_DAYS:-30}
    volumes:
      - ./data:/data
    # Only ./data is writable; /tmp (in memory) is for upload spill-over.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published ports: reachable only through the tunnel (http://mailcatcher:8080).

  cloudflared:
    # Pinned: bump on purpose (https://github.com/cloudflare/cloudflared/releases).
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    depends_on:
      mailcatcher:
        condition: service_healthy
