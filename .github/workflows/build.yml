name: Build
on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, LICENSE, .gitignore, "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04 # pinned 2026-11; move when GitHub retires the image
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Test
        run: go vet ./... && go test ./...
      - name: Resolve version and image name
        id: version
        run: |
          echo "version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Check the version isn't released yet
        id: gate
        run: |
          test -n "${{ steps.version.outputs.version }}" || { echo "no version found"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::notice::already released; bump the version to publish a new image"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        run: |
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          if ! test -s release-notes.md; then
            echo "_No changelog section for this version; commits since the last release:_" > release-notes.md
            git log --pretty='- %s' "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)..HEAD" >> release-notes.md
          fi
          {
            echo ""
            echo "Image: \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`"
            echo ""
            echo "---"
            echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } >> release-notes.md
      # Pure Go, so both architectures are cross-compiled here and the image build needs no emulation.
      - name: Compile
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/mailcatcher-$arch ./cmd/mailcatcher
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A released version's image is never replaced: after release this only builds.
      - name: Build image (pushed only for an unreleased version)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.gate.outputs.released == 'false' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Draft release
        if: steps.gate.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
